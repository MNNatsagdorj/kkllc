services:
  db:
    image: postgres:16
    container_name: kkllc-db
    environment:
      POSTGRES_DB: kkllc
      POSTGRES_USER: kkllc
      POSTGRES_PASSWORD: kkllc
      TZ: UTC
    ports:
      - "5440:5432"
    volumes:
      - kkllc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkllc -d kkllc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kkllc_pgdata:
